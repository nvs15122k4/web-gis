# Dịch vụ nền cho WebGIS: MySQL (dữ liệu ứng dụng), PostGIS (dữ liệu không gian), GeoServer (WMS).
# Laravel vẫn chạy trên máy host bằng `php artisan serve`. Xem HUONG_DAN_CHAY_WEB.md.
#   docker compose up -d
# Cổng MySQL là 3307 để không đụng MySQL cài sẵn trên máy (3306).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: webgis
      MYSQL_DATABASE: webgis_app
    ports: ["3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pwebgis"]
      interval: 5s
      retries: 20

  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: webgis
      POSTGRES_DB: webgis_spatial
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  geoserver:
    image: docker.osgeo.org/geoserver:2.27.2
    environment:
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
    ports: ["8080:8080"]
    volumes: [geoserver-data:/opt/geoserver_data]
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  mysql-data:
  pg-data:
  geoserver-data:
